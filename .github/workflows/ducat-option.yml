name: Ducat DLC option research checks

on:
  pull_request:
    paths:
      - 'src/ducat-option.ts'
      - 'src/ducat-option-vault-tree.ts'
      - 'src/ducat-option-cet-policy.ts'
      - 'tests/ducat-option.*'
      - '.github/workflows/ducat-option.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-option-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare temporary ES module from canonical TypeScript source
        run: cp src/ducat-option.ts src/ducat-option.mts
      - name: Verify candidate leaf and funded scenario invariants
        run: node --experimental-strip-types --test tests/ducat-option.offline.cjs

  package-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and compile DLC verifier
        run: npm run build
      - name: Run complete DLC verifier regression suite
        run: npm test
